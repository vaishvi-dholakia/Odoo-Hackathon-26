<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetFlow - Resource Booking</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../assets/css/style.css" rel="stylesheet">
  <style>
    /* FullCalendar Dark Theme adaptation styling */
    .fc {
      --fc-border-color: var(--border-color);
      --fc-daygrid-event-dot-width: 8px;
      --fc-page-bg-color: var(--card-bg);
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .fc .fc-toolbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .fc .fc-button-primary {
      background-color: var(--sidebar-hover);
      border-color: var(--border-color);
      color: var(--text-color);
      font-weight: 500;
      transition: var(--transition);
    }

    .fc .fc-button-primary:hover,
    .fc .fc-button-primary:focus {
      background-color: var(--border-color) !important;
      border-color: var(--border-color) !important;
      color: var(--text-color) !important;
      box-shadow: none !important;
    }

    .fc .fc-button-active {
      background-color: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
      color: white !important;
    }

    .fc-col-header-cell-cushion,
    .fc-daygrid-day-number {
      color: var(--text-color) !important;
      text-decoration: none !important;
    }

    .fc-theme-standard td,
    .fc-theme-standard th {
      border: 1px solid var(--border-color) !important;
    }
  </style>
</head>

<body>

  <!-- Dynamic Loader -->
  <div class="loader-wrapper" id="global-loader">
    <span class="loader"></span>
  </div>

  <div class="app-wrapper">
    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
      <!-- Navbar Placeholder -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content Area -->
      <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="fw-bold mb-0">Resource Booking</h2>
            <p class="text-muted mb-0">Schedule meeting rooms, vehicles, and hardware resources</p>
          </div>
          <button class="btn btn-primary-custom text-white" id="btn-open-booking-modal">
            <i class="fa-solid fa-calendar-plus me-2"></i>Book Resource
          </button>
        </div>

        <div class="row g-4">
          <!-- Calendar Widget -->
          <div class="col-xl-8">
            <div id="calendar-widget"></div>
          </div>

          <!-- Sidebar timeline and bookings stack -->
          <div class="col-xl-4">
            <!-- Resource Timeline View (Screen 6 Mockup) -->
            <div class="card-custom mb-4">
              <div class="mb-3">
                <h5 class="fw-bold mb-2"><i class="fa-solid fa-timeline me-2 text-primary"></i>Timeline & Conflict View</h5>
                <select id="timeline-resource-select" class="form-select form-control-custom w-100 py-1.5 px-3 fs-7">
                  <option value="" selected disabled>Select a Resource</option>
                </select>
              </div>
              <p class="text-muted small mb-3">Select a resource to inspect time slots and conflict indicators.</p>

              <!-- Timeline Grid -->
              <div class="d-flex flex-column gap-3 mb-3">
                <div class="p-3 text-center text-muted small border rounded-3 border-dashed border-secondary-subtle">
                  No bookings scheduled for the selected resource today.
                </div>
              </div>

              <button class="btn btn-primary-custom text-white w-100 py-2" id="btn-timeline-book-shortcut">
                <i class="fa-solid fa-calendar-plus me-1"></i>Book a slot
              </button>
            </div>

            <!-- My Bookings Side-panel -->
            <div class="card-custom mb-0">
              <!--h5 class="fw-bold mb-3"><i class="fa-solid fa-clock-history me-2 text-primary"></i>My Bookings</h5>-->
              <h5 class="fw-bold mb-3"><i class="fa-solid fa-clock-history me-2 text-primary"></i>Bookings</h5>
              <div class="d-flex flex-column gap-3" id="my-bookings-list">
                <!-- Injected dynamically -->
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Book Resource Modal -->
      <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content"
            style="border-radius: var(--border-radius); border: 1px solid var(--border-color); background-color: var(--card-bg);">
            <div class="modal-header border-bottom">
              <h5 class="modal-title fw-bold" id="bookingModalLabel">Book Resource</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="booking-form" novalidate>
              <div class="modal-body">

                <!-- Resource Select -->
                <div class="mb-3">
                  <label for="booking-resource" class="form-label-custom">Select Resource <span
                      class="text-danger">*</span></label>
                  <select id="booking-resource" class="form-select form-control-custom" required>
                    <option value="">Choose a resource...</option>
                  </select>
                  <div class="invalid-feedback d-block mt-1" id="booking-resource-error"></div>
                </div>

                <!-- Booked By -->
                <div class="mb-3">
                  <label for="booking-name" class="form-label-custom">Booked By (Full Name) <span
                      class="text-danger">*</span></label>
                  <input type="text" id="booking-name" class="form-control form-control-custom"
                    placeholder="e.g. John Doe" required>
                  <div class="invalid-feedback d-block mt-1" id="booking-name-error"></div>
                </div>

                <!-- Date -->
                <div class="mb-3">
                  <label for="booking-date" class="form-label-custom">Date <span class="text-danger">*</span></label>
                  <input type="date" id="booking-date" class="form-control form-control-custom" required>
                  <div class="invalid-feedback d-block mt-1" id="booking-date-error"></div>
                </div>

                <!-- Time Slot -->
                <div class="row g-2">
                  <div class="col-6">
                    <label for="booking-start" class="form-label-custom">Start Time <span
                        class="text-danger">*</span></label>
                    <input type="time" id="booking-start" class="form-control form-control-custom" required>
                    <div class="invalid-feedback d-block mt-1" id="booking-start-error"></div>
                  </div>
                  <div class="col-6">
                    <label for="booking-end" class="form-label-custom">End Time <span
                        class="text-danger">*</span></label>
                    <input type="time" id="booking-end" class="form-control form-control-custom" required>
                    <div class="invalid-feedback d-block mt-1" id="booking-end-error"></div>
                  </div>
                </div>

              </div>
              <div class="modal-footer border-top">
                <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary-custom text-white d-flex align-items-center"
                  id="btn-save-booking">
                  <span>Confirm Booking</span>
                  <span class="spinner-border spinner-border-sm ms-2 d-none" id="booking-spinner" role="status"
                    aria-hidden="true"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Footer Placeholder -->
      <div id="footer-placeholder"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/booking.js"></script>
</body>

</html>
