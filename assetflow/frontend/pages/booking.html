<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetFlow - Resource Booking</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../assets/css/style.css" rel="stylesheet">
  <style>
    /* FullCalendar Responsive & Compact Theme adaptation */
    .fc {
      --fc-border-color: var(--border-color);
      --fc-daygrid-event-dot-width: 8px;
      --fc-page-bg-color: var(--card-bg);
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 1rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      max-height: 540px;
    }

    .fc .fc-toolbar {
      margin-bottom: 0.75rem !important;
    }

    .fc .fc-toolbar-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .fc .fc-button-primary {
      background-color: var(--sidebar-hover);
      border-color: var(--border-color);
      color: var(--text-color);
      font-weight: 500;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      transition: var(--transition);
    }

    .fc .fc-button-primary:hover,
    .fc .fc-button-primary:focus {
      background-color: var(--border-color) !important;
      border-color: var(--border-color) !important;
      color: var(--text-color) !important;
      box-shadow: none !important;
    }

    .fc .fc-button-active {
      background-color: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
      color: white !important;
    }

    .fc-col-header-cell-cushion,
    .fc-daygrid-day-number {
      color: var(--text-color) !important;
      text-decoration: none !important;
      font-size: 0.8rem;
    }

    .fc-theme-standard td,
    .fc-theme-standard th {
      border: 1px solid var(--border-color) !important;
    }

    .fc-daygrid-day-frame {
      min-height: 65px !important;
      height: 100% !important;
    }

    .bookings-scroll-container {
      max-height: 260px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

  <!-- Dynamic Loader -->
  <div class="loader-wrapper" id="global-loader">
    <span class="loader"></span>
  </div>

  <div class="app-wrapper">
    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
      <!-- Navbar Placeholder -->
      <div id="navbar-placeholder"></div>

      <!-- Main Content Area -->
      <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="fw-bold mb-0">Resource Booking</h2>
            <p class="text-muted mb-0">Schedule meeting rooms, vehicles, and hardware resources</p>
          </div>
          <button class="btn btn-primary-custom text-white" id="btn-open-booking-modal">
            <i class="fa-solid fa-calendar-plus me-2"></i>Book Resource
          </button>
        </div>

        <div class="row g-4">
          
          <!-- Left Column: Smart Conflict Detector & Quick Reserve Panel + Active Reservations -->
          <div class="col-xl-5 col-lg-5">
            
            <!-- Quick Reserve & Smart Conflict Detector Panel -->
            <div class="card-custom mb-4 p-4">
              <div class="d-flex justify-content-between align-items-center mb-3.5">
                <h5 class="fw-bold mb-0 text-dark-custom"><i class="fa-solid fa-bolt me-2 text-primary"></i>Reserve & Conflict Detector</h5>
                <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1.5 fs-8 fw-bold">Live Checker</span>
              </div>

              <form id="quick-booking-form">
                <div class="mb-3.5">
                  <label for="quick-booking-resource" class="form-label-custom fs-7 text-muted mb-1.5 fw-semibold">Select Resource <span class="text-danger">*</span></label>
                  <select id="quick-booking-resource" class="form-select form-control-custom py-2 fs-6" required style="border-radius: 8px;">
                    <option value="">Choose a resource...</option>
                  </select>
                </div>

                <!-- AI Smart Resource Detection Card (Red Theme for Occupied Status) -->
                <div id="ai-resource-detection-card" class="card-custom p-3.5 mb-4 border-danger-subtle d-none" style="border-radius: 12px; background-color: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); overflow: hidden;">
                  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3 border-bottom border-danger-subtle pb-2">
                    <span class="fs-7 fw-bold text-danger text-uppercase"><i class="fa-solid fa-calendar-xmark me-1.5"></i>Booked Schedule</span>
                    <span id="ai-booking-count-badge" class="badge bg-danger text-white fs-8 px-2.5 py-1 rounded-pill fw-bold">0 Active</span>
                  </div>
                  <div id="ai-resource-booking-schedule-list" class="d-flex flex-column gap-2.5">
                    <!-- Injected dynamically by AI Detector -->
                  </div>
                </div>

                <div class="row g-3 mb-3.5">
                  <div class="col-6">
                    <label for="quick-booking-date" class="form-label-custom fs-7 text-muted mb-1.5 fw-semibold">Reservation Date <span class="text-danger">*</span></label>
                    <input type="date" id="quick-booking-date" class="form-control form-control-custom py-2 fs-6" required style="border-radius: 8px;">
                  </div>
                  <div class="col-3">
                    <label for="quick-booking-start" class="form-label-custom fs-7 text-muted mb-1.5 fw-semibold">Start Time</label>
                    <input type="time" id="quick-booking-start" class="form-control form-control-custom py-2 fs-6" value="09:00" style="border-radius: 8px;">
                  </div>
                  <div class="col-3">
                    <label for="quick-booking-end" class="form-label-custom fs-7 text-muted mb-1.5 fw-semibold">End Time</label>
                    <input type="time" id="quick-booking-end" class="form-control form-control-custom py-2 fs-6" value="10:00" style="border-radius: 8px;">
                  </div>
                </div>

                <!-- Smart Real-Time Conflict Alert Box -->
                <div id="quick-booking-conflict-alert" class="alert py-2 px-3 mt-3 mb-3.5 rounded-2 d-none" style="font-size: 0.78rem;">
                  <!-- Dynamic Conflict Alert Message Injected Here -->
                </div>

                <!-- Visual Time Slots Grid Bar (8 AM - 6 PM) -->
                <div class="mb-4">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fs-7 fw-bold text-muted text-uppercase">Time Slots Availability Grid</span>
                    <small class="fs-8 text-muted"><span class="badge bg-success rounded-circle p-1"></span> Available <span class="badge bg-danger rounded-circle p-1 ms-1.5"></span> Booked</small>
                  </div>
                  <div id="visual-time-slot-grid" class="d-flex flex-wrap gap-2 p-3 border rounded-3 bg-body-tertiary">
                    <span class="text-muted fs-7 italic">Select a resource and date to inspect slots...</span>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary-custom text-white w-100 py-2.5 fs-6 fw-bold" id="btn-quick-reserve" style="border-radius: 8px;">
                  <i class="fa-solid fa-calendar-check me-2"></i>Reserve Slot Now
                </button>
              </form>
            </div>

            <!-- Active Reservations Ledger Card -->
            <div class="card-custom mb-0 py-3">
              <h5 class="fw-bold mb-3"><i class="fa-solid fa-list-check me-2 text-primary"></i>Active Reservations</h5>
              <div class="bookings-scroll-container px-1" id="my-bookings-list">
                <!-- Injected dynamically -->
              </div>
            </div>

          </div>

          <!-- Right Column: Resource Availability Calendar -->
          <div class="col-xl-7 col-lg-7">
            <div class="card-custom mb-0 p-3">
              <h6 class="fw-bold mb-3 text-uppercase text-muted fs-8"><i class="fa-solid fa-calendar-days me-2 text-primary"></i>Resource Availability Calendar</h6>
              <div id="calendar-widget"></div>
            </div>
          </div>

        </div>

      </div>

      <!-- Book Resource Modal -->
      <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content"
            style="border-radius: var(--border-radius); border: 1px solid var(--border-color); background-color: var(--card-bg);">
            <div class="modal-header border-bottom">
              <h5 class="modal-title fw-bold" id="bookingModalLabel">Book Resource</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="booking-form" novalidate>
              <div class="modal-body">

                <!-- Resource Select -->
                <div class="mb-3">
                  <label for="booking-resource" class="form-label-custom">Select Resource <span
                      class="text-danger">*</span></label>
                  <select id="booking-resource" class="form-select form-control-custom" required>
                    <option value="">Choose a resource...</option>
                  </select>
                  <div class="invalid-feedback d-block mt-1" id="booking-resource-error"></div>
                </div>

                <!-- Booked By -->
                <div class="mb-3">
                  <label for="booking-name" class="form-label-custom">Booked By (Full Name) <span
                      class="text-danger">*</span></label>
                  <input type="text" id="booking-name" class="form-control form-control-custom"
                    placeholder="e.g. John Doe" required>
                  <div class="invalid-feedback d-block mt-1" id="booking-name-error"></div>
                </div>

                <!-- Date -->
                <div class="mb-3">
                  <label for="booking-date" class="form-label-custom">Date <span class="text-danger">*</span></label>
                  <input type="date" id="booking-date" class="form-control form-control-custom" required>
                  <div class="invalid-feedback d-block mt-1" id="booking-date-error"></div>
                </div>

                <!-- Time Slot -->
                <div class="row g-2">
                  <div class="col-6">
                    <label for="booking-start" class="form-label-custom">Start Time <span
                        class="text-danger">*</span></label>
                    <input type="time" id="booking-start" class="form-control form-control-custom" required>
                    <div class="invalid-feedback d-block mt-1" id="booking-start-error"></div>
                  </div>
                  <div class="col-6">
                    <label for="booking-end" class="form-label-custom">End Time <span
                        class="text-danger">*</span></label>
                    <input type="time" id="booking-end" class="form-control form-control-custom" required>
                    <div class="invalid-feedback d-block mt-1" id="booking-end-error"></div>
                  </div>
                </div>

              </div>
              <div class="modal-footer border-top">
                <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary-custom text-white d-flex align-items-center"
                  id="btn-save-booking">
                  <span>Confirm Booking</span>
                  <span class="spinner-border spinner-border-sm ms-2 d-none" id="booking-spinner" role="status"
                    aria-hidden="true"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Footer Placeholder -->
      <div id="footer-placeholder"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/booking.js"></script>
</body>

</html>
