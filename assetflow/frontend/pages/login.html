<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetFlow - Sign In</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="../index.html" class="text-decoration-none d-inline-flex align-items-center mb-3">
          <i class="fa-solid fa-cube text-primary fs-2 me-2"></i>
          <span class="fs-3 fw-bold text-dark">AssetFlow</span>
        </a>
        <h4 class="fw-bold">Welcome Back!</h4>
        <p class="text-muted">Sign in to your enterprise workspace</p>
      </div>

      <form id="login-form" autocomplete="off" novalidate>
        <!-- Role Selection -->
        <div class="mb-3">
          <label for="role-select" class="form-label-custom">Select Role</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0" style="border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm); border: 1px solid var(--border-color);"><i class="fa-solid fa-user-tie text-muted"></i></span>
            <select class="form-select form-control-custom border-start-0 ps-1" id="role-select" required style="border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0; cursor: pointer;">
              <option value="" selected disabled>Choose your role...</option>
              <option value="Admin">Admin</option>
              <option value="Asset Manager">Asset Manager</option>
              <option value="Department Head">Department Head</option>
              <option value="Employee">Employee</option>
            </select>
          </div>
        </div>

        <div id="credentials-section">
          <!-- Email Input -->
          <div class="mb-3">
            <label for="email" class="form-label-custom">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm); border: 1px solid var(--border-color);"><i class="fa-solid fa-envelope text-muted"></i></span>
              <input type="email" id="email" class="form-control form-control-custom border-start-0 ps-1" placeholder="name@company.com" autocomplete="off" required style="border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;">
            </div>
            <div class="invalid-feedback d-block mt-1" id="email-error"></div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label-custom">Password</label>
              <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0" style="border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm); border: 1px solid var(--border-color);"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" id="password" class="form-control form-control-custom border-start-0 border-end-0 ps-1" placeholder="••••••••" autocomplete="off" required style="border-radius: 0;">
              <button type="button" class="btn btn-outline-secondary border-start-0 bg-white" id="password-toggle" style="border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0; border: 1px solid var(--border-color);"><i class="fa-solid fa-eye text-muted"></i></button>
            </div>
            <div class="invalid-feedback d-block mt-1" id="password-error"></div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="mb-4 d-flex justify-content-between align-items-center">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="remember-me">
              <label class="form-check-label text-muted small" for="remember-me">Remember this browser</label>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-custom w-100 py-2.5 text-white mb-3 d-flex justify-content-center align-items-center" id="btn-login-submit">
            <span>Sign In</span>
            <span class="spinner-border spinner-border-sm ms-2 d-none" id="login-spinner" role="status" aria-hidden="true"></span>
          </button>
        </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Axios & SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- API & Auth JS -->
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
